name: Docker build & publish

on:
    push:
        branches: ["*"]
        # Publish semver tags as releases.
        tags: ["v*"]
    pull_request:
        branches: ["*"]

env:
    # Use docker.io for Docker Hub if empty
    REGISTRY: ghcr.io
    # github.repository as <account>/<repo>
    IMAGE_NAME: ${{ github.repository }}
    BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
            security-events: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Setup Docker buildx
              uses: docker/setup-buildx-action@v3

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{version}}

            # - name: Extract tag for trivy scan
            #   id: trivy_tag
            #   run: |
            #       first_tag=$(echo '${{ steps.meta.outputs.tags }}' | tr ',' '\n' | grep -v ':latest' | head -n1)
            #       echo "tag<<EOF" >> $GITHUB_OUTPUT
            #       echo "${first_tag}" >> $GITHUB_OUTPUT
            #       echo "EOF" >> $GITHUB_OUTPUT

            - name: Build Docker image
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile
                  pull: true
                  push: false
                  load: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # - name: Run Trivy vulnerability scanner
            #   uses: aquasecurity/trivy-action@0.30.0
            #   with:
            #       image-ref: ${{ steps.trivy_tag.outputs.tag }}
            #       format: "sarif"
            #       output: "trivy-results.sarif"

            # - name: Upload Trivy scan results to GitHub Security tab
            #   uses: github/codeql-action/upload-sarif@v3
            #   with:
            #       sarif_file: "trivy-results.sarif"

    push:
        if: startsWith(github.event.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
            security-events: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Docker buildx
              uses: docker/setup-buildx-action@v3

            # https://github.com/docker/login-action
            - name: Log into registry ${{ env.REGISTRY }}
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=sha
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}

            - name: Build & Push image to github registry and generate SBOM
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile
                  pull: true
                  push: true
                  load: false
                  sbom: true
                  provenance: mode=max
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
